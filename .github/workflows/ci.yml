name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: SmartFactoryBackend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: SmartFactoryBackend

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: SmartFactoryBackend

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smart-factory-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: smart-factory-frontend

      - name: Build
        run: npm run build
        working-directory: smart-factory-frontend